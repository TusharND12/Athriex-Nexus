name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p nexus-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/nexus${{ matrix.ext }}"
          ASSET="nexus-${{ matrix.name }}${{ matrix.ext }}"
          cp "$BIN" "$ASSET"
          shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/nexus.exe"
          $asset = "nexus-${{ matrix.name }}.exe"
          Copy-Item $bin $asset
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii -NoNewline "$asset.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-${{ matrix.name }}${{ matrix.ext }}
            nexus-${{ matrix.name }}${{ matrix.ext }}.sha256

  publish-npm:
    name: Publish to npm
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      # The `secrets` context can't be used in a job-level `if`, so detect the
      # token in a step and gate the rest. Without NPM_TOKEN the job is a no-op
      # (stays green) — publish manually with `npm publish`, or add the secret.
      - name: Check for npm token
        id: token
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN not set — skipping npm publish."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Sync package version from tag
        if: steps.token.outputs.present == 'true'
        working-directory: npm
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Publish
        if: steps.token.outputs.present == 'true'
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
