[workspace]
resolver = "2"
members = [
    "crates/nexus-cli",
    "crates/nexus-core",
    "crates/nexus-memory",
    "crates/nexus-context",
    "crates/nexus-knowledge",
    "crates/nexus-git",
    "crates/nexus-scanner",
    "crates/nexus-decision",
    "crates/nexus-snapshot",
    "crates/nexus-handoff",
    "crates/nexus-compression",
    "crates/nexus-search",
    "crates/nexus-nxp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Tushar Dhokane"]
repository = "https://github.com/athreix/nexus"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
git2 = "0.19"
rayon = "1.10"
regex = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"
tempfile = "3.14"

nexus-core = { path = "crates/nexus-core" }
nexus-memory = { path = "crates/nexus-memory" }
nexus-context = { path = "crates/nexus-context" }
nexus-knowledge = { path = "crates/nexus-knowledge" }
nexus-git = { path = "crates/nexus-git" }
nexus-scanner = { path = "crates/nexus-scanner" }
nexus-decision = { path = "crates/nexus-decision" }
nexus-snapshot = { path = "crates/nexus-snapshot" }
nexus-handoff = { path = "crates/nexus-handoff" }
nexus-compression = { path = "crates/nexus-compression" }
nexus-search = { path = "crates/nexus-search" }
nexus-nxp = { path = "crates/nexus-nxp" }

[profile.release]
lto = true
codegen-units = 1
strip = true
